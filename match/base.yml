# espanso match file

# For a complete introduction, visit the official docs at: https://espanso.org/docs/

# You can use this file to define the base matches (aka snippets)
# that will be available in every application when using espanso.

# Matches are substitution rules: when you type the "trigger" string
# it gets replaced by the "replace" string.

# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/match.schema.json

# And much more! For more information, visit the docs: https://espanso.org/docs/

global_vars:
  - name: email
    type: echo
    params:
      echo: "kaldrenon@proton.me"

matches:
  #
  # Espanso
  #
  - trigger: ;sn # basic snippet
    replace: |-
      - trigger:
        replace:

  #
  # Personal
  #

  # FFXIV
  - trigger: ;mcdf # Link to MCDF folder
    replace: https://drive.google.com/drive/folders/1Swwj1PRsUjrcMaqZc8wxxTe0cOV3klOq?usp=sharing

  # Email
  - trigger: ;em
    replace: "{{email}}"

  - trigger: ;canspam
    replace: >
      This promotional email does not include clear and conspicuous instructions on how to unsubscribe.
      That is in direct violation of CAN-SPAM and is therefore illegal.
      In addition to unsubscribing me from this list, please uphold your legal obligation to provide
      such instructions in all promotional email.
      Please do not respond to this message except to acknowledge that I have been unsubscribed and
      that you will begin complying with the law. Thank you.

  # Discord
  - trigger: ";sp"
    replace: "||{{clipb}}||"
    vars:
      - name: "clipb"
        type: "clipboard"

  #
  # Obsidian
  #

